<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle - sage green from logo -->
  <circle cx="50" cy="50" r="50" fill="#9FB1A3"/>

  <!-- Simplified house structure -->
  <!-- Main house body -->
  <rect x="30" y="45" width="40" height="30" fill="#E8A847" stroke="#8B6F47" stroke-width="1"/>

  <!-- Roof - barn style curved roof -->
  <path d="M 25 45 Q 30 35 50 32 Q 70 35 75 45 Z" fill="#A67C52" stroke="#704D2F" stroke-width="1"/>

  <!-- Chimney -->
  <rect x="58" y="28" width="6" height="10" fill="#C8784A" stroke="#704D2F" stroke-width="0.5"/>

  <!-- Window -->
  <rect x="43" y="52" width="8" height="8" fill="#5A4A3A" stroke="#3A2A1A" stroke-width="0.5"/>
  <line x1="47" y1="52" x2="47" y2="60" stroke="#8B7A6A" stroke-width="0.5"/>
  <line x1="43" y1="56" x2="51" y2="56" stroke="#8B7A6A" stroke-width="0.5"/>

  <!-- Door -->
  <rect x="56" y="60" width="7" height="15" fill="#3A2A1A" stroke="#2A1A0A" stroke-width="0.5"/>

  <!-- Ground/grass suggestion -->
  <ellipse cx="50" cy="78" rx="35" ry="6" fill="#8A9B7A" opacity="0.6"/>

  <!-- Small tree/bush silhouette -->
  <ellipse cx="72" cy="72" rx="5" ry="7" fill="#6B7C5A" opacity="0.7"/>
</svg>
